<svg width="200" height="100" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основа линзы (оранжевый градиент) -->
  <rect x="5" y="5" width="190" height="90" rx="20" ry="20" fill="url(#orangeGradient)" stroke="#CC5500" stroke-width="2"/>
  
  <!-- Блик для эффекта стекла -->
  <ellipse cx="60" cy="35" rx="25" ry="10" fill="white" fill-opacity="0.3"/>
  
  <!-- Градиент -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>